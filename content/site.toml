[[part.section]]
id = "data-flow"
title = "State & data flow"

[[part.section.entry]]
id = "state-binding"
title = "@State & @Binding"
aliases = ["state", "binding", "two way", "child view", "$ projection", "source of truth", "@State vs @Binding", "when to use @Binding", "child edits parent", "child changes parent state", "copy not shared", "form header binding"]
code = ["swiftui/State.swift:CounterScreen", "swiftui/State.swift:CounterControl"]
availability = "iOS 13+"
use_when = "Simple values owned by one view. The child gets a `@Binding` to read and write the parent's state."
gotcha = "One owner per value. The view that owns it uses `@State` (mark it private); every child that must change it takes a `@Binding` and gets `$value`. A child that declares its own `@State` gets a COPY, made once: its edits never reach the parent, and later parent changes never reach it. A child that only reads needs neither: a plain `let`. Passing a new initial value to `@State` later does not reset it; the view keeps its own storage."

[[part.section.entry]]
id = "observable"
title = "@Observable, @Environment & @Bindable"
aliases = ["Observation", "model", "environment", "Bindable", "shared state", "view model", "$model.property", "binding to a model property", "Stepper binding", "why does Stepper need a binding", "Toggle TextField Slider Picker binding", "binding vs method call", "cannot find $ in scope"]
code = ["swiftui/Observation.swift:StudySession", "swiftui/Observation.swift:SessionScreen", "swiftui/Observation.swift:SessionEditor"]
availability = "iOS 17+"
use_when = "A model shared by several views. The owner keeps it in `@State`; children read it from the environment."
gotcha = "Views only re-render for properties their `body` actually reads. Controls that change a value themselves (`Stepper`, `Toggle`, `TextField`, `Slider`, `Picker`) take a `Binding`: a get plus a set. A `Button` only runs your closure, so it calls a method and needs no binding. The `$` comes from the property wrapper, not from `@Observable`: an owned `@State private var model` gives `$model.size` directly; a model you were handed (a plain `let`, or `@Environment`) needs `@Bindable` first."

[[part.section.entry]]
id = "observable-object"
title = "Older code: ObservableObject"
aliases = ["StateObject", "ObservedObject", "Published", "legacy", "Combine"]
code = ["swiftui/LegacyOwnership.swift:LegacyCounter", "swiftui/LegacyOwnership.swift:LegacyOwner", "swiftui/LegacyOwnership.swift:LegacyChild"]
availability = "iOS 14+"
use_when = "Existing codebases before iOS 17. `@StateObject` owns the model; `@ObservedObject` borrows it."
gotcha = "`@ObservedObject` in the owner recreates the model on every parent update. The owner must use `@StateObject`."

