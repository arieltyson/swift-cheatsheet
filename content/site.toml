[[part.section.entry]]
id = "date-labels"
title = "Hour labels (12 AM) & date headers"
aliases = ["12 AM", "12 PM", "AM PM", "12-hour clock", "hour label", "hour % 12", "0 AM bug", "format date", "Date.FormatStyle", "formatted", "weekday wide", "Monday, November", "date header", "DateFormatter", ".dateTime", "dateTime", "weekday(.wide)", "month(.wide)", "day()", "abbreviated month", "Jan 1"]
