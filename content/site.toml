aliases = ["Timer", "invalidate", "repeating", "polling", "timer leak", "loop task"]
code = ["concurrency/Memory.swift:Ticker"]
availability = "iOS 16+"
gotcha = "A repeating `Timer` keeps its closure, and anything it captures, alive until `invalidate()`. Capture `[weak self]` and invalidate when stopping and in `deinit`."

