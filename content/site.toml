table = { header = ["Need", "Write", "Notes"], rows = [
  ["A preview in any file", "`#Preview { MyView() }`", "At file scope, outside every type. Canvas: Editor > Canvas (Opt-Cmd-Return); refresh with Opt-Cmd-P."],
  ["Several, named", "`#Preview(\"Empty\") { ... }` twice", "Each gets a tab in the canvas."],
  ["Custom data", "`#Preview { EventRow(event: Event(title: \"Standup\", start: 9, end: 10)) }`", "Build the values right there, or add a `static let sample` on the type."],
  ["A view that takes a Binding", "`@Previewable @State var on = true` then `Toggle(\"x\", isOn: $on)`", "Why: the `#Preview` body is a closure, not a View, so a bare `@State` there has nowhere to live. `@Previewable` (Xcode 16) wraps the body in a hidden View that owns it. Put those lines first. Not needed when the view owns its own `@State` or takes plain values. `.constant(true)` also compiles, but it never changes, so pickers and fields look frozen."],
  ["An `@Observable` model the view reads", "`MyView().environment(Store())`", "Pass exactly what the app passes, or the preview crashes."],
  ["A view that takes a closure (`let onSave: (Song) -> Void`)", "`#Preview { SongForm(onSave: { _ in }) }` or `SongForm { _ in }`", "A do-nothing closure: `_` ignores the input. To see it fire: `{ print($0) }`."],
  ["Preview won't build but its file looks fine", "Fix the errors in OTHER files (Issue navigator, Cmd-5)", "The canvas compiles the whole app target, so one error anywhere (often a call site you just broke by adding a parameter) stops every preview."],
  ["Title or toolbar visible", "`NavigationStack { MyView() }`", "Toolbars only show inside one."],
  ["As a sheet", "`Text(\"\").sheet(isPresented: .constant(true)) { Form() }`", "Shows the real sheet size and detents."],
  ["Dark mode or bigger text", "`.preferredColorScheme(.dark)`, `.dynamicTypeSize(.xxxLarge)`", "Or the canvas's variant buttons."],
  ["Older code", "`struct X_Previews: PreviewProvider { static var previews: some View { ... } }`", "Still works; `#Preview` (iOS 17 / Xcode 15) is the modern form."],
] }
use_when = "Seeing a view without running the app. If the canvas says it crashed, the view is usually missing something the app provides (environment model, NavigationStack)."

