code = ["swiftui/Toolbar.swift:ToolbarPlacements", "swiftui/Toolbar.swift:ToolbarSides"]
availability = "iOS 17+"
use_when = "Any button in the nav bar or bottom bar. In a sheet or form: `.cancellationAction` + `.confirmationAction`. Elsewhere: `.topBarLeading` / `.topBarTrailing`."
figure = { src = "figures/toolbar-placements.png", alt = "Two phones. Left: a form sheet with Cancel at top left, Principal in the centre, a greyed Save at top right, and a trash button and bottomBar label at the bottom. Right: a list with Edit at top left, Sides title, and a plus at top right.", caption = "ToolbarPlacements (left): semantic placements plus .principal and .bottomBar. ToolbarSides (right): explicit leading and trailing." }
gotcha = "Shape: `.toolbar { ToolbarItem(placement: .x) { Button(...) } }`. One view per `ToolbarItem`; several need `ToolbarItemGroup`. Put a `Button`, not a `Text`, inside or nothing is tappable. `dismiss` is read with `@Environment(\\.dismiss) private var dismiss` and CALLED with `dismiss()` (it is a value you call, like a function). In Save, hand the data back first (`onSave(item)`), then `dismiss()`. The toolbar needs the sheet's own `NavigationStack`."

[[part.section.entry]]
id = "icon-buttons"
title = "Icon buttons: Label, SF Symbols & labelStyle"
aliases = ["Label", "systemImage", "SF Symbol", "plus button", "icon button", "Image systemName", "labelStyle", "iconOnly", "titleOnly", "titleAndIcon", "button with icon", "accessibilityLabel"]
code = ["swiftui/Toolbar.swift:IconButtons"]
availability = "iOS 17+"
use_when = "A button shown as a symbol. Prefer `Button(\"Add\", systemImage: \"plus\") { ... }`: one line, and the title still reaches VoiceOver and overflow menus even when only the icon shows."
figure = { src = "figures/icon-buttons.png", alt = "Three bordered buttons stacked: a plus with the word Add, then two plus-only buttons, then the text Added 0.", caption = "IconButtons: the shorthand shows title and icon; .iconOnly and a bare Image show just the symbol." }
gotcha = "A bare `Image(systemName:)` has no text, so VoiceOver reads the symbol name; add `.accessibilityLabel`. Toolbars show a `Label` as its icon automatically, so no `.labelStyle` is needed there. A `Void` action needs no `return`: leave it empty while prototyping."

[[part.section.entry]]
id = "button-roles"
title = "Button roles: destructive, cancel & styles"
aliases = ["role", "ButtonRole", "role: .destructive", "role: .cancel", "red button", "delete button", "destructive button", "buttonStyle", "bordered", "borderedProminent", "confirmationDialog", "are you sure", "delete confirmation"]
code = ["swiftui/FormControls.swift:ButtonRoles"]
availability = "iOS 17+"
use_when = "`.destructive` for anything that deletes or discards (Delete Event); `.cancel` for the back-out choice in dialogs and alerts. No role for everything else."
figure = { src = "figures/button-roles.png", alt = "A form. First section: No role in blue, Delete in red, Cancel in blue. Second section: bordered Plain, bordered red Delete, filled blue Save, filled red Delete. Below: a Show a dialog button.", caption = "ButtonRoles. .destructive turns red in every style; .cancel looks plain in a Form but is placed and bolded apart in dialogs." }
gotcha = "Syntax: `Button(\"Delete\", role: .destructive) { ... }`; the role comes before the action. A role describes meaning; the system picks the look, so don't also set `.foregroundStyle(.red)`. In `.confirmationDialog` and `.alert`, the `.cancel` button is moved to its own slot automatically, and a `.destructive` one is red. For a delete that can't be undone, confirm with `.confirmationDialog` first."

[[part.section.entry]]
id = "button-styles"
title = "Button styles, and why .plain"
aliases = ["buttonStyle", "plain button style", ".plain", "borderless", "bordered", "borderedProminent", "glass", "glassProminent", "controlSize", "buttonBorderShape", "capsule button", "tint", "whole row tappable", "both buttons fire", "two buttons in a List row", "button turns text blue", "custom button label blue", "NavigationLink blue text", "card button"]
code = ["swiftui/FormControls.swift:ButtonStyles", "swiftui/FormControls.swift:Card", "swiftui/FormControls.swift:RowButtons"]
availability = "iOS 15+ (.glass: iOS 26)"
use_when = "`.borderedProminent` for the one main action (Save), `.bordered` for secondary ones, `.plain` when the label is your own design (a card, a row, a cell) and `.borderless` for several buttons in one List row."
figure = { src = "figures/button-styles.png", alt = "Buttons stacked: .automatic, .plain in black, .borderless, .bordered on a grey capsule, .borderedProminent filled blue, a large green capsule, and .glassProminent. Below, two Standup cards: the left one with its title and time tinted blue on a pale blue card, the right one keeping black text, a grey time and a grey card.", caption = "ButtonStyles. The two cards at the bottom are the same view: the default style tints the whole label, .plain keeps its colours." }
gotcha = "Why `.plain` is everywhere: the default style (1) tints EVERY text and image in a custom label with the accent colour, so cards and rows turn blue (also true for a `NavigationLink`), and (2) in a `List` or `Form` row makes the whole row the tap target, so two buttons in one row BOTH fire on any tap. `.plain` fixes both and leaves only a dim on press; `.borderless` fixes the row problem but keeps the tint. Size and shape are separate modifiers: `.controlSize(.large)`, `.buttonBorderShape(.capsule)`, `.tint(.green)`. Put `.buttonStyle` on a container to style every button inside."

[[part.section.entry]]
id = "navigation-choose"
title = "Which navigation API, when"
aliases = ["NavigationView deprecated", "NavigationStack vs NavigationSplitView", "NavigationLink destination", "NavigationLink value", "navigationDestination", "NavigationPath", "push vs sheet", "fullScreenCover", "modern navigation", "iOS 16 navigation"]
table = { header = ["Need", "Use", "Notes"], rows = [
  ["Drill down on iPhone", "`NavigationStack` + `NavigationLink(_:value:)` + `.navigationDestination(for:)`", "The modern pattern (iOS 16+). The link carries data; the destination is declared once per type."],
  ["Push or pop from code (after Save, deep link, pop to root)", "`NavigationStack(path: $path)` with `@State var path: [Route]`", "`append` pushes, `removeLast()` pops, `removeAll()` pops to root."],
  ["Routes of different types on one stack", "`NavigationPath()`", "Type-erased; same `append`/`removeLast`. Use `[Route]` when one type (often an enum) covers every screen."],
  ["Sidebar + detail on iPad and Mac", "`NavigationSplitView`", "Two or three columns; collapses to a stack on iPhone. Drive it with a `List(selection:)`."],
  ["A quick edit or form that returns", "`.sheet(item:)` or `.sheet(isPresented:)`", "Not part of the back stack; give the sheet its own `NavigationStack` for Cancel and Save."],
  ["A full-screen flow (onboarding, camera)", "`.fullScreenCover`", "No swipe to dismiss; provide a Close button."],
  ["Older code", "`NavigationView`, `NavigationLink(destination:)`", "Deprecated. Fine to read; write the stack versions."],
] }
use_when = "Choosing how screens connect. Pushes go on a stack (Back button, swipe back); sheets and covers sit on top and are dismissed."

[[part.section.entry]]
id = "sheet-basics"
title = "Presenting sheets: isPresented, item, detents & dismiss"
aliases = ["sheet", "sheet(isPresented:)", "sheet(item:)", "present a form", "modal", "presentationDetents", "half sheet", "medium sheet", "dismiss", "Environment dismiss", "close sheet", "fullScreenCover", "interactiveDismissDisabled", "sheet not showing", "open sheet from toolbar", "isPresented vs item", "Bool sheet", "optional sheet", "edit sheet for row"]
code = ["swiftui/Sheets.swift:Memo", "swiftui/Sheets.swift:SheetIsPresented", "swiftui/Sheets.swift:SheetItem", "swiftui/Sheets.swift:NoteForm"]
availability = "iOS 17+"
use_when = "A short task on top of the current screen: a create or edit form, a picker. `isPresented:` with a `Bool` for one fixed form; `item:` with an optional for \"the form for this item\"."
figure = { src = "figures/sheet-medium.png", alt = "A Notes list dimmed behind a half-height sheet titled New Note, with Cancel on the left, Save on the right and a form row reading Fields go here.", caption = "SheetIsPresented after tapping plus: a .medium detent sheet with its own NavigationStack for Cancel and Save." }
gotcha = "Both take a binding (`$`) because the sheet sets it back (false or nil) when swiped down. Rule of thumb: New = `isPresented:`; Edit this row = `item:` (avoids a Bool plus a separate optional getting out of sync). Give the sheet its own `NavigationStack` for a title and toolbar. Inside it, close with `@Environment(\\.dismiss)`; don't pass the Bool down. `.fullScreenCover` has the same API but no swipe to dismiss; `.interactiveDismissDisabled()` blocks the swipe on a sheet with unsaved changes."

[[part.section.entry]]
id = "child-to-parent"
title = "Sending data back from a child or sheet"
aliases = ["pass data back", "closure runs when", "passing vs calling a closure", "who calls onSave", "child to parent", "callback", "closure property", "onSave", "completion handler", "@escaping", "non-escaping parameter", "sheet returns a value", "Binding vs closure", "pass the model", "delegate in SwiftUI"]
code = ["swiftui/ChildToParent.swift:Contact", "swiftui/ChildToParent.swift:ContactBook", "swiftui/ChildToParent.swift:ContactsScreen", "swiftui/ChildToParent.swift:ContactForm", "swiftui/ChildToParent.swift:FavouriteField", "swiftui/ChildToParent.swift:ContactCount", "swiftui/ChildToParent.swift:RenameForm"]
availability = "iOS 17+"
use_when = "A form in a sheet must give its result to the screen that opened it. A closure (`onSave: (Item) -> Void`) is the usual choice: the child stays reusable and the parent decides what Save means."
gotcha = "Passing a closure does NOT run it: `ContactForm { contact in book.add(contact) }` hands over instructions, like a Button's action. They run only when the child calls `onSave(contact)` (from its Save button), so the parent never knows when, only what to do. A stored closure property needs no init: `ContactForm { contact in ... }` uses the memberwise init. Write your own init and the parameter needs `@escaping`. A `@Binding` suits one value the parent owns; passing the whole model is shortest but ties the child to it."

[[part.section.entry]]
id = "tap-location"
title = "Tap empty space & tap items on top"
aliases = ["onTapGesture location", "tap empty area", "tap to create", "which row was tapped", "location.y", "contentShape", "tap through", "ZStack tap order", "hit testing", "allowsHitTesting", "Button vs onTapGesture"]
code = ["swiftui/Taps.swift:SlotBoard"]
