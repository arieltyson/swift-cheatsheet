[[part.section.entry]]
id = "swift-types"
title = "Swift's kinds of types at a glance"
aliases = ["types", "all types", "kinds of types", "which type should I use", "struct enum class actor protocol", "value vs reference", "tuple", "typealias", "function type", "Optional", "collection types", "Int Double Decimal Bool"]

[part.section.entry.table]
swift_first_column = true
header = ["Type", "Semantics", "Best for", "Nuances"]
rows = [
  ["`struct`", "Value", "Data records: a transaction, a point, a draft in a form. The default choice", "Free memberwise `init`. Methods that change it are `mutating`. A `let` struct can't change at all. No inheritance"],
  ["`enum`", "Value", "A fixed set of choices or states: `.loading`, `.loaded`, `.failed`; error reasons", "Associated values carry data per case. `switch` must cover every case. Raw values (`String`, `Int`) or associated values, never both"],
  ["`class`", "Reference", "One object with identity that many parts of the app hold: a store, a view model, a service", "Needs an `init` unless every property has a default. Mark it `final` unless you mean to subclass. `===` checks same object. Watch for retain cycles"],
  ["`actor`", "Reference", "Mutable state touched from several tasks at once: a cache, a counter, a download queue", "Runs one caller at a time, so outside calls need `await`. Re-entrant: state can change across an `await` inside it"],
  ["`protocol`", "A contract", "Describing what a type can do, so code depends on the ability: `Identifiable`, a `RepoService` you can fake in tests", "Default methods via `extension`. `some P` is one hidden concrete type (fast); `any P` is a box that can hold any conforming type"],
  ["Tuple `(Int, String)`", "Value", "Returning two or three values from a function: `(min, max)`", "Not `Hashable`, can't conform to protocols, so use a struct as a dictionary key or anything long-lived"],
  ["Function type `(Int) -> Bool`", "Reference", "Passing behaviour around: `sorted(by:)`, `onSave` callbacks", "Closures capture variables by reference; `[weak self]` avoids retain cycles. `@escaping` when stored for later, `@Sendable` when run in another task"],
  ["`Optional<T>`, written `T?`", "Value (an enum)", "A value that may be missing: `first`, a dictionary lookup, a failed parse", "Really `enum { case none, some(T) }`. Unwrap with `if let`, `guard let`, `??`. Avoid `!`"],
  ["`Array`, `Dictionary`, `Set`", "Value, copy on write", "Ordered list, key to value lookup, unique members", "Copying is free until one copy changes. Dictionary and Set need `Hashable` elements and have no order"],
  ["`Int`, `Double`, `Decimal`, `Bool`, `String`", "Value", "`Int` for counts and money in cents, `Double` for measurements, `Decimal` for exact base-10 money, `String` for text", "All are structs. `Double` can't store 0.1 exactly. `String` indexes aren't `Int`: use `Array(s)` for index-heavy work"],
  ["`typealias`", "Same as original", "A shorter or clearer name: `typealias Cents = Int`", "Not a new type, so the compiler still lets an `Int` go where `Cents` is expected"],
  ["Generic `<T>`", "Depends on `T`", "One function or type that works for many types: `Stack<Element>`", "Constrain with `where T: Comparable`. Swift makes a specialised version, so it costs nothing at runtime"],
]

[[part.section.entry]]
id = "optionals"
title = "Optionals, if let & guard"
aliases = ["nil", "unwrap", "nil coalescing", "??", "guard let", "optional binding", "Int from String", "guard direction", "popLast optional", "value of optional type must be unwrapped", "guard order", "side effect in guard"]
code = ["dsa/Language.swift:demoOptionals", "dsa/Language.swift:firstEven"]
time = "O(n)"
space = "O(1)"
gotcha = "Never force-unwrap (`!`) a value that can legitimately be missing. Use `guard let` to exit early. `guard` continues when the condition is true: `guard !xs.isEmpty`, not `guard xs.isEmpty`. `popLast()`, `first` and `last` return optionals; unwrap before reading a property. Guard conditions run left to right and stop at the first false one, so put the checks that only look before anything that changes state: `guard status == .playing, let m = moves.popLast()`, not the reverse."

[[part.section.entry]]
id = "value-semantics"
title = "struct vs class"
aliases = ["value type", "reference type", "copy on write", "identity", "===", "return a copy", "reads return copies", "model struct store class", "encapsulation"]
code = ["dsa/Language.swift:demoValueSemantics"]
gotcha = "Arrays, dictionaries, sets and strings are values: copying is O(1) until one copy is mutated, then O(n). A common design is a struct for each record and a class for the one store that owns them. Returning a struct (or an array of them) hands the caller a copy, so changing it can't touch the store, and the only way to change real data is to call one of the store's methods."

[[part.section.entry]]
id = "closures"
title = "Closures"
aliases = ["lambda", "$0", "trailing closure", "sorted by", "higher order", "closure return", "missing return", "tuple", "destructure", "let (a, b)", "closure in if", "confusable with the body", "multiple trailing closures", "two closures", "onSave onDelete", "trailing closure label"]
code = ["dsa/Language.swift:demoClosures", "dsa/Language.swift:demoTuples"]
gotcha = "A multi-line closure needs an explicit `return`. In an `if`/`guard`/`while` condition, write `xs.allSatisfy({ ... })` or store it in a `let` first: a trailing closure there looks like the statement's body. Tuples destructure with `let (a, b) = pair`; arrays don't. Two closure parameters: the first trailing closure drops its label, later ones keep it: `Form(item: x) { save($0) } onDelete: { delete(x) }`. When that reads badly, pass both inside the parentheses with labels. A trailing closure must be the LAST parameter, so declare closure properties after the others (memberwise init follows declaration order)."

[[part.section.entry]]
id = "static-members"
title = "static func, static let & Self"
aliases = ["static", "static func", "static let", "static var", "type method", "class method", "Self.", "helper function shared between views", "share a function between files", "free function", "global function", "sample data", "static member cannot be used on instance", "instance member cannot be used on type"]
code = ["dsa/Language.swift:Workout", "dsa/Language.swift:demoStatic"]
use_when = "A helper or constant that needs no instance: a formatter two views share (`Workout.minutesLabel(90)`), `static let sample` for previews, a factory like `Workout.empty`. Put it on the type it is about."
gotcha = "Call statics on the TYPE: `Workout.minutesLabel(5)`. On a value it errors: \"static member cannot be used on instance\". The reverse (an instance property from a static) errors with \"instance member cannot be used on type\": statics have no `self`. Inside the type, reach a static with `Self.minutesLabel(...)`. Alternative: a free function at file top level, callable as `minutesLabel(5)` from any file; fine for small apps, but a static groups it with its type."

[[part.section.entry]]
id = "self-kinds"
title = "self, Self, Type.self & \\.self"
aliases = ["self", "Self", ".self", "\\.self", "Self vs self", "id: \\.self", "ForEach id self", "identity key path", "key path", "map(\\.self)", "Int.self", "Type.self", "decode([Item].self", "metatype", ".Type", "\\.Self"]
code = ["dsa/Language.swift:Score", "dsa/Language.swift:demoSelfKinds"]
use_when = "`\\.self` when each element is its own ID (`ForEach(0..<24, id: \\.self)`). `Self.` to reach a static from inside the type. `Type.self` when an API wants the type itself (`decode([Item].self, from:)`)."
gotcha = "Lowercase `self` is always a value: inside a method it is this instance (`self.count` when a parameter has the same name); after a type name, `Int.self` is the type as a value. Capital `Self` is a type: the one the code is written inside, so `Self.hourLabel(9)` calls a static. A key path starts at a value, so only `\\.self` exists; `\\.Self` doesn't compile. `id: \\.self` needs the element to be `Hashable` and unique: two equal strings in a `ForEach` get the same ID."

[[part.section.entry]]
id = "argument-labels"
title = "Argument labels, `_` & calling a method"
aliases = ["argument label", "external name", "_ parameter", "underscore parameter", "func add(_", "missing argument label", "extraneous argument label", "call a method", "property vs method", "expression unused", "result unused", "from to labels", "call a closure"]
code = ["dsa/Language.swift:SongQueue", "dsa/Language.swift:demoArgumentLabels"]
gotcha = "The caller writes the label, not the parameter name: `func add(_ song:)` is called `add(x)`; `func add(song:)` is called `add(song: x)`. Wrong label errors read \"missing/extraneous argument label\". Writing `store.items` in a closure just reads the array (an unused-value warning, no change); to change it, call the method: `store.add(item)`. Calling a closure variable takes no labels: `onSave(item)`."

[[part.section.entry]]
id = "discardable-result"
title = "@discardableResult"
aliases = ["@discardableResult", "discardable result", "result of call is unused", "unused result warning", "_ =", "ignore return value", "return value from mutating method"]
code = ["dsa/Language.swift:Clicker", "dsa/Language.swift:demoDiscardableResult"]
use_when = "A method that mainly DOES something (records, inserts, saves) and also returns a handy value, such as the new item, that many callers won't need."
gotcha = "Without it, ignoring a non-Void result gives the warning \"result of call to 'click()' is unused\", and callers have to write `_ = clicker.click()`. It only silences that warning: the function still runs, and if it `throws`, callers still need `try`. Leave it off pure questions such as `total()` or `sorted()`, because ignoring their result is almost always a bug the warning should catch."

[[part.section.entry]]
id = "enums"
title = "Enums with associated values"
aliases = ["enum", "switch", "pattern matching", "associated value", "computed property", "if case", "guard case", "case let", "Equatable enum", "raw value", "rawValue", "enum String", "CaseIterable", "allCases", "init rawValue"]
code = ["dsa/Language.swift:Shape", "dsa/Language.swift:Switch", "dsa/Language.swift:demoEnums"]
gotcha = "Plain enums get `==` for free. With associated values you must write `: Equatable` (Swift then synthesizes `==`). An enum has raw values OR associated values, never both."

[[part.section.entry]]
id = "starting-values"
title = "Starting values: property defaults, init & memberwise init"
aliases = ["default value", "default property value", "initial value", "sample data", "seed data", "array literal of structs", "init default parameter", "memberwise init", "memberwise initializer", "init", "initializer", "where do I put default data", "cannot convert value of type to expected argument type"]
code = ["dsa/Language.swift:Song", "dsa/Language.swift:Playlist", "dsa/Language.swift:demoStartingValues"]
use_when = "A type needs data from the start: sample events, an empty board, settings. The simplest place is the property's own default: `var items: [Item] = [Item(...), Item(...)]`."
gotcha = "A default must match the property's type: an array property needs `[ ... ]`, even for one element. Classes need an `init` unless every property has a default; structs get a memberwise init for free. Don't both default AND append the same items in `init`, or they appear twice."

[[part.section.entry]]
id = "property-observers"
title = "Property observers: willSet & didSet"
aliases = ["didSet", "willSet", "property observer", "oldValue", "newValue", "run code when a property changes", "observe property", "on change", "clamp value"]
code = ["dsa/Language.swift:Thermostat", "dsa/Language.swift:demoPropertyObservers"]
use_when = "Something must happen every time a stored property changes: reset a game when its size changes, clamp a value, keep a log."
gotcha = "Observers don't run for assignments inside `init`, so an init still has to do the setup itself. Assigning the property inside its own `didSet` doesn't call the observers again. They work in `@Observable` classes; for a SwiftUI view reacting to a change, use `.onChange(of:)`."

[[part.section.entry]]
id = "access-control"
title = "private, private(set) & internal"
aliases = ["private", "private(set)", "fileprivate", "internal", "public", "access control", "read-only property", "private(set) vs computed property", "hide storage", "read only from outside", "inaccessible due to private protection level", "computed property vs function", "Bool naming", "isEmpty vs count"]
code = ["dsa/Language.swift:Tally", "dsa/Language.swift:demoAccessControl", "dsa/Language.swift:Shelf", "dsa/Language.swift:demoReadOnlyViews"]
gotcha = "`private(set) var items` lets callers read the stored value exactly as it is but only the type can assign it; it is the simplest choice when the stored data is already what callers want. `private var storage` plus a computed `var items: [Item] { ... }` hides how data is stored and builds the answer on each read (sorted, filtered, summed), so you can change the storage later (an array to a dictionary) without changing callers; the cost is that the work runs on every read. Either way callers of a struct get a copy. A method the view calls (a button's `undo()`) can't be `private`. Keep helpers private, and use `private(set)` for state the view reads but must not change. A yes/no question is a computed property named for when it is true (`var canUndo: Bool { !moves.isEmpty }`), negated at the call site: `.disabled(!game.canUndo)`. Prefer `isEmpty` over `count > 0`."

