[[part.section]]
id = "layout"
title = "Layout & accessibility"

[[part.section.entry]]
id = "stacks-layout"
title = "Stacks, frames & Dynamic Type"
aliases = ["VStack", "HStack", "frame", "padding", "Label", "font", "accessibility", "44 points", "Divider", "Divider vertical", "horizontal line", "line next to text", "Divider in HStack", "spacing 0", "ScrollView spacing", "gaps between rows"]
code = ["swiftui/Layout.swift:ReviewSummary"]
availability = "iOS 14+"
gotcha = "Use text styles (`.headline`, `.body`), never fixed point sizes, so text follows the user's size setting. `Divider` runs across its stack: horizontal in a `VStack`, but a VERTICAL line in an `HStack`. For a horizontal line beside text, use `Rectangle().fill(.quaternary).frame(height: 1)`, or wrap the `Divider` in a `VStack`. Stacks (and the content of a `ScrollView`) add default spacing between children; use `VStack(spacing: 0)` when rows must be an exact height."

[[part.section.entry]]
id = "text-styles"
title = "Text styles: largeTitle to caption2"
aliases = ["font", "font size", "largeTitle", "title", "title2", "title3", "headline", "subheadline", "subtitle", "body", "callout", "footnote", "caption", "caption2", "Dynamic Type", "text size", "bold text", "fontWeight"]
code = ["swiftui/TextStyles.swift:TextStyleScale"]
availability = "iOS 14+"
use_when = "Choosing a size for text. Pick by role: `.headline` for a row's main line, `.subheadline`/`.footnote` for details, `.caption` for labels like hour markers. Unstyled `Text` is `.body`."
figure = { src = "figures/text-styles.png", alt = "Eleven lines of text in decreasing size: largeTitle, title, title2, title3, headline in bold, subheadline, body, callout, footnote, caption and caption2.", caption = "TextStyleScale at the default text size. Each style grows or shrinks with the user's setting." }
gotcha = "There is no `.subtitle`; the closest is `.subheadline`. `.headline` is body-sized but semibold. Change weight with `.fontWeight(.bold)` or `.bold()`, not by picking a bigger style. Avoid `.font(.system(size: 14))`: a fixed size ignores the user's text size setting."

[[part.section.entry]]
id = "foreground-styles"
title = "Foreground styles: primary, secondary & tint"
aliases = ["foregroundStyle", "foregroundColor", "primary", "secondary", "tertiary", "quaternary", "quinary", "grey text", "gray text", "muted text", "tint", "accent color", "text color", "dark mode color"]
code = ["swiftui/TextStyles.swift:ForegroundStyles"]
availability = "iOS 17+"
use_when = "Making text or shapes less prominent. `.secondary` for supporting text, `.tertiary`/`.quaternary` for faint lines and placeholders, `.tint` for anything tappable."
figure = { src = "figures/foreground-styles.png", alt = "The same list in light mode on white and dark mode on black: primary, then progressively fainter secondary, tertiary, quaternary and quinary, then tint in blue and red in red.", caption = "ForegroundStyles in light (left) and dark (right). The hierarchical styles adapt; fixed colours stay the same." }
gotcha = "`.foregroundColor` is the old name; use `.foregroundStyle`. The same styles work as fills: `Rectangle().fill(.quaternary)` makes a faint divider. `Color.gray` doesn't adapt to dark mode the way `.secondary` does."

[[part.section.entry]]
id = "stack-vs-frame-alignment"
title = "Stack alignment vs frame alignment"
aliases = ["VStack alignment", "VStack(alignment: .leading)", "HorizontalAlignment", "text centred in VStack", "second line centered", "lines not left aligned", "left align two texts", "alignment leading", "frame alignment not working", "align text left"]
code = ["swiftui/Modifiers.swift:StackVsFrameAlignment"]
availability = "iOS 17+"
use_when = "Any block of stacked lines (title + subtitle) that should be left-aligned: `VStack(alignment: .leading)` for the lines, `.frame(maxWidth: .infinity, alignment: .leading)` to push the block left."
figure = { src = "figures/stack-vs-frame-alignment.png", alt = "Two blue cards, each with Morning run, 7 AM – 8 AM and a code label. Top card: the shorter lines are centred under the title. Bottom card: all lines start at the left edge.", caption = "Both cards use .frame(alignment: .topLeading). Only the bottom one also sets the VStack's alignment." }
gotcha = "A `VStack` is as wide as its widest child and centres the others inside that width by default. The frame's alignment only moves the whole stack, so shorter lines still sit centred under the longest. Set both: `VStack(alignment: .leading)` (horizontal only: `.leading`, `.center`, `.trailing`) and the frame's `.topLeading`. HStack's alignment is vertical (`.top`, `.firstTextBaseline`)."

[[part.section.entry]]
id = "background-vs-style"
title = "background vs backgroundStyle"
aliases = ["background", "backgroundStyle", "background color", "background in shape", "capsule background", "rounded background", "background not showing", "fill behind text"]
code = ["swiftui/Modifiers.swift:BackgroundVsStyle"]
availability = "iOS 16+"
use_when = "Colouring behind a view: `.background(.blue)`, or `.background(.blue, in: .rect(cornerRadius: 8))` for a shape. `.backgroundStyle` is for setting one style that `.background()` and some controls pick up."
figure = { src = "figures/background-vs-style.png", alt = "Four lines of text. background yellow: a yellow rectangle. background yellow in capsule: a yellow pill. backgroundStyle yellow alone: no colour at all. background() plus backgroundStyle: a yellow rectangle.", caption = "BackgroundVsStyle: `.backgroundStyle` by itself draws nothing." }
