gotcha = "`Date` follows the wall clock, which can jump when the system time changes. To add calendar days, use `Calendar`, not multiples of 86,400 seconds."

[[part.section.entry]]
id = "fixed-dates"
title = "Fixed dates: timeIntervalSince1970 & the Unix epoch"
aliases = ["timeIntervalSince1970", "Date(timeIntervalSince1970:)", "1970", "Unix epoch", "epoch", "86_400", "86400", "seconds in a day", "fixed date for tests", "deterministic dates", "Date.now in tests", "test dates", "UTC"]
code = ["dsa/Dates.swift:demoFixedDates"]
availability = "Foundation"
use_when = "Tests and sample data that must give the same answer every run. Never `Date()` or `Date.now` in a test: the result would depend on when it runs."
gotcha = "A `Date` is just a count of seconds from a fixed zero point, the Unix epoch (1 January 1970, 00:00 UTC, a Thursday), so `timeIntervalSince1970: 0` is that moment and `86_400` (24 x 60 x 60) is one day later. The `_` in `86_400` is only a digit separator. Adding raw seconds ignores time zones and daylight saving, where a local day can be 23 or 25 hours, so real calendar features use `Calendar` (`date(byAdding:value:to:)`, `startOfDay(for:)`) with an explicit `TimeZone`."

[[part.section.entry]]
