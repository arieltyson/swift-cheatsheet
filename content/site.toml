[[part.section.entry]]
id = "array-operations"
title = "append, remove & insert"
aliases = ["push", "pop", "popLast", "removeFirst", "insert at", "swapAt", "reverse", "reverse array", "reverse list", "remove(at:)", "remove at index", "remove by value", "removeAll(where:)", "delete by id", "remove element"]
code = ["dsa/Arrays.swift:demoArrayOperations", "dsa/Arrays.swift:demoRemoveByValue"]
gotcha = "`removeLast()` crashes on an empty array; `popLast()` returns nil. `removeFirst()` and `insert(_:at: 0)` are O(n). `remove(at:)` takes an INDEX and crashes if it is out of range; there is no `remove(value)`. To remove by value or id: `firstIndex(where:)` + `remove(at:)` (first match), or `removeAll { $0.id == id }` (all matches, no optional to unwrap)."

[[part.section.entry]]
id = "sorted-insert"
title = "firstIndex(of:) vs firstIndex(where:), insert(_:at:) & endIndex"
aliases = ["firstIndex(of:)", "firstIndex(where:)", "firstIndex", "insert(_:at:)", "insert at index", "endIndex", "startIndex", "keep array sorted", "sorted insert", "insert in order", "?? endIndex", "newest first insert", "stable ties", "index of element", "one past the end"]
code = ["dsa/Arrays.swift:demoSortedInsert"]
time = "O(n) find + O(n) shift"
space = "O(1)"
use_when = "Keeping an array always in order as items arrive, so reading it is free. If items arrive in bulk, append them all and sort once instead."
gotcha = "`firstIndex(of: x)` looks for a value equal to `x` and needs Equatable elements. `firstIndex(where:)` (usually written `firstIndex { ... }`) returns the index of the first element whose test is true. Both return an `Int?`, nil when nothing matches. `insert(x, at: i)` puts `x` at position `i` and moves everything from `i` onward one place right; `i` may be anything from `0` to `endIndex`. `endIndex` equals `count`, one past the last element, so `firstIndex { ... } ?? endIndex` means \"before the first element that should come after me, or at the end if none does\". With `<=` a new item goes before existing equal ones; with `<` after them, which fixes how ties are ordered."

