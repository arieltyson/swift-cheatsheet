aliases = ["round half", "round to 2 decimals", "floor", "ceil", "truncate", "toNearestOrEven", "Int(Double)", "Int(0.30)", "convert Double to Int", "dollars to cents", "drops the decimal"]
code = ["dsa/Formatting.swift:demoRounding"]
gotcha = "`rounded()` rounds half away from zero (2.5 to 3); Python and banking round half to even. `Int(someDouble)` doesn't round: it drops everything after the point, so `Int(0.30)` is `0` and `Int(2.9)` is `2`. To turn dollars into cents, multiply by 100 and round first: `Int((dollars * 100).rounded())`. Better still, keep cents as `Int` from the start so no conversion is needed."

