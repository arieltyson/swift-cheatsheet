[[part.section.entry]]
id = "offset-directions"
title = "offset: move a view without moving its neighbours"
aliases = ["offset", "offset x", "offset y", "move view", "shift view", "negative offset", "offset vs padding", "offset vs position", "nudge"]
code = ["swiftui/Modifiers.swift:OffsetDirections"]
availability = "iOS 13+"
use_when = "Placing views from data (an event at y = start x 60) inside a top-leading ZStack, or nudging something. Positive x is right, positive y is DOWN; negative goes left or up."
figure = { src = "figures/offset-directions.png", alt = "Five orange chips with dashed outlines at their original spots. x 40 moved right, x minus 20 moved left, y 12 down, y minus 12 up, and x 40 y 12 right and down.", caption = "OffsetDirections: the dashed box is where layout put each chip; the colour is where it is drawn." }
