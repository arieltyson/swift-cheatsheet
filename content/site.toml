[[part.section.entry]]
id = "money-in-cents"
title = "Store money as integer cents or Decimal"
aliases = ["float precision", "0.1 + 0.2", "Decimal", "cents to dollars", "quotientAndRemainder", "why not Double for money", "floating point error", "binary fraction", "amountCents", "Decimal literal"]
code = ["dsa/Formatting.swift:demoCents"]
use_when = "Any calculation with money. Never use Double for amounts you add up."
gotcha = "A `Double` stores a number in binary, and most decimal fractions such as 0.1 have no exact binary form (just as 1/3 has no exact decimal form), so it keeps the nearest value it can. That tiny error makes `0.1 + 0.2 == 0.3` false and grows as you add thousands of amounts. Integer cents (`1234` for $12.34) are exact, fast and `Comparable`, so they are the simplest choice in an interview; turn them into dollars only for display. `Decimal` stores base-10 digits and is exact too, but `let d: Decimal = 0.1` is built from a Double literal and can carry the error, so write `Decimal(string: \"0.1\")!`."

