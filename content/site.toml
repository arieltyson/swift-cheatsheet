[[part.section.entry]]
id = "frames-aspect-ratio"
title = "Frame tuning & aspectRatio"
aliases = ["frame", "maxWidth", "maxHeight", "minWidth", "minHeight", ".infinity", "fill width", "full width", "fixed size", "fixedSize", "frame alignment", "aspectRatio", "contentMode", ".fit", ".fill", "scaledToFit", "scaledToFill", "square", "16:9", "clipped", "resizable", "cells too big", "layout overflows screen", "not square", "maxHeight value", "what does infinity mean", "hugging", "takes only the space it needs", "modifier order"]
code = ["swiftui/Frames.swift:FrameTuning", "swiftui/Frames.swift:AspectRatioGallery"]
availability = "iOS 16+"
use_when = "Sizing a view to the space it's offered. `maxWidth: .infinity` fills; `width:` fixes; `min`/`max` set a range. `aspectRatio` then picks a shape inside that space."
figure = { src = "figures/aspect-ratio.png", alt = "Six 160 by 100 point dashed slots. No modifier fills the slot. 16/9 fit is a wide band touching the sides. 1 fit is a centred square. 1 fill covers the slot and is clipped. 3/4 fit is a narrow centred portrait. scaledToFit shows a mountain symbol at its own proportions.", caption = "AspectRatioGallery on an iPhone: the dashed box is the space offered, the colour is the size the view chose." }
gotcha = "Text, Image and Button hug their content: they take only what they need, not what is offered, until a frame lets them grow. `.infinity` means \"accept whatever the parent offers\", not \"be infinitely big\"; with no `maxHeight`, the height stays the content's own. Order matters. Size first, then shape: `.frame(maxWidth: .infinity, maxHeight: .infinity).aspectRatio(1, contentMode: .fit)` makes a square that grows with the screen. `.fill` overflows the slot unless you add `.clipped()`. Never hardcode the screen width (390): devices differ, so let the frame fill and the ratio decide."

