use_when = "A Stepper, Toggle, TextField or Slider looks stuck to the screen edges even though the stack centres its children."
figure = { src = "figures/greedy-controls.png", alt = "Three grey boxes the width of the screen, each holding a Count stepper. With no modifier the label touches the left edge and the buttons the right. With padding both are inset. With fixedSize the label and buttons sit together in the centre.", caption = "GreedyControls on an iPhone: each grey box is the screen." }
gotcha = "A stack centres a child only when the child is narrower than the stack. `Stepper`, `Toggle`, `TextField`, `Slider`, `Color` and shapes are greedy: they take the full width, so \"centred\" is edge to edge. `.padding()` is the usual fix (it insets everything); `.fixedSize()` makes the control hug its content so the stack can centre it."

[[part.section.entry]]
