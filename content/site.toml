availability = "iOS 15+"
time = "O(1) amortized per append, O(n) per check"
space = "O(n), n = values in the window"
use_when = "Many threads add timestamped values and you only care about the most recent stretch of time."
gotcha = "A `Task` per value does not keep arrival order, and eviction relies on that order, so feed the actor from one loop. `.bufferingNewest` drops the oldest values if that loop falls behind. `Deque` is in the swift-collections package, not the standard library."

[[part.section.entry]]
