  ["Invalid input", "Is bad input rejected AND is nothing stored?", "`#expect(throws: MyError.x) { ... }` then check state is unchanged"],
  ["Exactness", "Do sums come out exact (money in cents)?", "`#expect(total == 30)` after adding 10 and 20, in the same unit (cents), never `Int(0.30)`"],
