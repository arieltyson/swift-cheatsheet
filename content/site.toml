gotcha = "`.navigationTitle`, `.navigationBarTitleDisplayMode` and `.toolbar` go on a view INSIDE the `NavigationStack`, not on the stack: on the stack they are silently ignored. `.automatic` uses the previous screen's mode, which is `.large` at the root. A bare `.toolbar { Button }` goes top trailing; use `ToolbarItem(placement:)` to choose."

[[part.section.entry]]
id = "toolbar-placements"
