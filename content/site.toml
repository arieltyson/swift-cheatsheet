[[part.section.entry]]
id = "result-type"
title = "Result<Success, Failure>"
aliases = ["Result", "success failure", "get()", "completion Result", "store an error", "Result map", "flatMap", "mapError", "Result catching", "Result vs throws", "typed Result", "Result<Int, Error>", "Result<Void"]
code = ["dsa/Errors.swift:demoResult", "dsa/Errors.swift:demoResultMore"]
use_when = "Storing an outcome or passing it to a completion handler. In async code, prefer `throws`."
gotcha = "`Result` is an enum with two cases, `.success(value)` and `.failure(error)`, so it turns a thrown error into a value you can keep in an array, a property or a callback. `Result { try f() }` (the catching initializer) captures either outcome; `.get()` turns it back into a throw. `map` changes only the success value, `flatMap` chains a step that can fail, and `mapError` changes the error. `Failure` must conform to `Error`; use `any Error` when anything can fail, or your own enum for a closed list. Result is `Equatable` when both its types are. For a function you call and handle right away, `throws` reads better: Result is mainly for completion handlers and stored outcomes."

