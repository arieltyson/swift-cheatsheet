figure = { src = "figures/targeted-padding.png", alt = "Five mint boxes, each with code text inside. padding(): space on all sides. leading 40: space only on the left. horizontal 40: space left and right. vertical 16: space above and below. top and trailing 24: space above and to the right.", caption = "TargetedPadding: the mint box is the size after padding." }
