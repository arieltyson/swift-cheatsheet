[[part]]
id = "dsa"
title = "Pure DSA Swift"

[[part.section]]
id = "language"
title = "Language essentials"
group = "Syntax"

[[part.section.entry]]
id = "optionals"
title = "Optionals, if let & guard"
aliases = ["nil", "unwrap", "nil coalescing", "??", "guard let", "optional binding", "Int from String", "guard direction", "popLast optional", "value of optional type must be unwrapped", "guard order", "side effect in guard"]
code = ["dsa/Language.swift:demoOptionals", "dsa/Language.swift:firstEven"]
time = "O(n)"
space = "O(1)"
gotcha = "Never force-unwrap (`!`) a value that can legitimately be missing. Use `guard let` to exit early. `guard` continues when the condition is true: `guard !xs.isEmpty`, not `guard xs.isEmpty`. `popLast()`, `first` and `last` return optionals; unwrap before reading a property. Guard conditions run left to right and stop at the first false one, so put the checks that only look before anything that changes state: `guard status == .playing, let m = moves.popLast()`, not the reverse."

[[part.section.entry]]
id = "value-semantics"
title = "struct vs class"
aliases = ["value type", "reference type", "copy on write", "identity", "==="]
code = ["dsa/Language.swift:demoValueSemantics"]
gotcha = "Arrays, dictionaries, sets and strings are values: copying is O(1) until one copy is mutated, then O(n)."

[[part.section.entry]]
id = "closures"
title = "Closures"
aliases = ["lambda", "$0", "trailing closure", "sorted by", "higher order", "closure return", "missing return", "tuple", "destructure", "let (a, b)", "closure in if", "confusable with the body"]
code = ["dsa/Language.swift:demoClosures", "dsa/Language.swift:demoTuples"]
gotcha = "A multi-line closure needs an explicit `return`. In an `if`/`guard`/`while` condition, write `xs.allSatisfy({ ... })` or store it in a `let` first: a trailing closure there looks like the statement's body. Tuples destructure with `let (a, b) = pair`; arrays don't."

[[part.section.entry]]
id = "argument-labels"
title = "Argument labels, `_` & calling a method"
aliases = ["argument label", "external name", "_ parameter", "underscore parameter", "func add(_", "missing argument label", "extraneous argument label", "call a method", "property vs method", "expression unused", "result unused", "from to labels", "call a closure"]
code = ["dsa/Language.swift:SongQueue", "dsa/Language.swift:demoArgumentLabels"]
gotcha = "The caller writes the label, not the parameter name: `func add(_ song:)` is called `add(x)`; `func add(song:)` is called `add(song: x)`. Wrong label errors read \"missing/extraneous argument label\". Writing `store.items` in a closure just reads the array (an unused-value warning, no change); to change it, call the method: `store.add(item)`. Calling a closure variable takes no labels: `onSave(item)`."

[[part.section.entry]]
id = "enums"
title = "Enums with associated values"
aliases = ["enum", "switch", "pattern matching", "associated value", "computed property", "if case", "guard case", "case let", "Equatable enum", "raw value", "rawValue", "enum String", "CaseIterable", "allCases", "init rawValue"]
code = ["dsa/Language.swift:Shape", "dsa/Language.swift:Switch", "dsa/Language.swift:demoEnums"]
gotcha = "Plain enums get `==` for free. With associated values you must write `: Equatable` (Swift then synthesizes `==`). An enum has raw values OR associated values, never both."

[[part.section.entry]]
id = "starting-values"
title = "Starting values: property defaults, init & memberwise init"
aliases = ["default value", "default property value", "initial value", "sample data", "seed data", "array literal of structs", "init default parameter", "memberwise init", "memberwise initializer", "init", "initializer", "where do I put default data", "cannot convert value of type to expected argument type"]
code = ["dsa/Language.swift:Song", "dsa/Language.swift:Playlist", "dsa/Language.swift:demoStartingValues"]
use_when = "A type needs data from the start: sample events, an empty board, settings. The simplest place is the property's own default: `var items: [Item] = [Item(...), Item(...)]`."
gotcha = "A default must match the property's type: an array property needs `[ ... ]`, even for one element. Classes need an `init` unless every property has a default; structs get a memberwise init for free. Don't both default AND append the same items in `init`, or they appear twice."

[[part.section.entry]]
id = "property-observers"
title = "Property observers: willSet & didSet"
aliases = ["didSet", "willSet", "property observer", "oldValue", "newValue", "run code when a property changes", "observe property", "on change", "clamp value"]
code = ["dsa/Language.swift:Thermostat", "dsa/Language.swift:demoPropertyObservers"]
use_when = "Something must happen every time a stored property changes: reset a game when its size changes, clamp a value, keep a log."
gotcha = "Observers don't run for assignments inside `init`, so an init still has to do the setup itself. Assigning the property inside its own `didSet` doesn't call the observers again. They work in `@Observable` classes; for a SwiftUI view reacting to a change, use `.onChange(of:)`."

[[part.section.entry]]
id = "access-control"
title = "private, private(set) & internal"
aliases = ["private", "private(set)", "fileprivate", "internal", "public", "access control", "inaccessible due to private protection level", "computed property vs function", "Bool naming", "isEmpty vs count"]
code = ["dsa/Language.swift:Tally", "dsa/Language.swift:demoAccessControl"]
gotcha = "A method the view calls (a button's `undo()`) can't be `private`. Keep helpers private, and use `private(set)` for state the view reads but must not change. A yes/no question is a computed property named for when it is true (`var canUndo: Bool { !moves.isEmpty }`), negated at the call site: `.disabled(!game.canUndo)`. Prefer `isEmpty` over `count > 0`."

