gotcha = "Clear or empty areas don't receive taps until you add `.contentShape(.rect)`. In a ZStack, later layers are in front and get the tap first. Prefer one Button per row when rows are fixed; it works with VoiceOver, which a bare tap location doesn't."

[[part.section.entry]]
id = "tap-kinds"
title = "Every tap: Button, onTapGesture, count, location, long press"
aliases = ["onTapGesture", "tap gesture", "double tap", "onTapGesture(count: 2)", "long press", "onLongPressGesture", "tap location", "make view tappable", "Text tappable", "Button vs onTapGesture", "gesture"]
code = ["swiftui/Taps.swift:TapKinds"]
availability = "iOS 17+"
use_when = "`Button` for anything that is an action (it highlights, works with VoiceOver and in Lists). `onTapGesture` when a view must react but isn't button-like (a calendar block, a canvas), or you need the tap's location."
gotcha = "Order matters: put `.onTapGesture` after the frame/background you want tappable and before outer `.padding` you don't. A double-tap handler delays single taps on the same view while it waits. In a List, a row's Button makes the whole row tappable; `onTapGesture` on Text only covers the text (see contentShape)."

[[part.section.entry]]
id = "tap-regions"
title = "contentShape: making empty space tappable"
aliases = ["contentShape", "contentShape(.rect)", "Spacer not tappable", "tap on empty space", "whole row tappable", "hit area", "hit testing", "tap only works on text", "clear background tap", "tappable area"]
code = ["swiftui/Taps.swift:TapRegions"]
availability = "iOS 17+"
use_when = "A row, cell or clear area whose blank parts should respond: hour rows in a timeline, a list row built from an HStack with a Spacer, a Button whose label is wider than its text."
figure = { src = "figures/tap-regions.png", alt = "Three rows, green where taps register. Row 1: only the words Tap me are green; the rest of the bordered row is white. Row 2: the whole row is green. Row 3: a Button whose whole wide label is green.", caption = "TapRegions. Green = answers taps. Without contentShape only drawn content counts; with it the whole frame does." }
gotcha = "Taps hit only what is drawn: text, filled shapes, non-clear backgrounds. Spacers, padding and `.clear` are holes. `.contentShape(.rect)` goes AFTER the `.frame` it should cover. A filled `.background` also catches taps, but contentShape works without changing the look. Opposite need: `.allowsHitTesting(false)` lets taps pass through a view to the one behind."

