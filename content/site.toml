[[part]]
id = "testing"
title = "Testing"

[[part.section]]
id = "swift-testing"
title = "Swift Testing"
group = "Unit tests"
intro = "Swift Testing ships with Xcode 16 and Swift 6. Run tests with Cmd-U in Xcode or `swift test` in Terminal. Each check below is a real test that runs in this site's own `swift test`."

[[part.section.entry]]
id = "first-test-file"
title = "A test file from scratch"
aliases = ["write a test", "first test", "test file", "how to start testing", "@Test", "#expect", "#require", "@Suite", "import Testing", "arguments", "@Test(arguments:)", "parameterized", "@testable import", "test target", "fresh instance per test", "display name", "test naming"]
code = ["testing/Pantry.swift:Pantry", "testing/Pantry.swift:PantryError", "testing/PantryTests.swift:PantryTests"]
use_when = "Any type with logic: write the test right after each method, one `@Test` per behaviour."
gotcha = "The file needs `import Testing`, plus `@testable import YourModule` to reach `internal` types in the library target. `@Test` marks a function as a test, and `#expect(condition)` records a failure but keeps going, while `try #require(...)` stops the test (use it to unwrap an optional you need for later checks). Add `throws` to a test that calls throwing code, so an unexpected error fails it. A stored property in a `@Suite` struct is recreated for every test, so tests can't leak state into each other. Name tests for the behaviour (`rejectsCountsBelowOne`), or pass a sentence: `@Test(\"An empty pantry has nothing in it\")`."

[[part.section.entry]]
id = "suite"
title = "@Suite: what it gives you"
aliases = ["@Suite", "suite", "test struct", "group tests", "shared setup", "setUp", "fresh state per test", "test isolation", "init in tests", "deinit teardown", "nested suite", ".serialized", "traits", ".disabled", ".tags"]

[part.section.entry.table]
header = ["Feature", "How", "Why it matters"]
rows = [
  ["Grouping", "Put related `@Test` functions inside one `struct`", "The Test navigator and the report show them together under one name"],
  ["A readable name", "`@Suite(\"Ledger recording\") struct LedgerTests`", "The report shows the sentence instead of the type name"],
  ["Shared setup", "Stored properties (`let ledger = Ledger()`) or an `init()`", "Every test starts from the same known state without repeating the setup lines"],
  ["Fresh state per test", "Swift Testing creates a NEW suite instance for every test (and every argument)", "One test's data can never leak into another, so order doesn't matter"],
  ["Teardown", "Make the suite a `final class` or `actor` and write `deinit`", "Cleanup after each test, like XCTest's `tearDown()`"],
  ["Optional", "A `struct` with `@Test` methods is a suite even without `@Suite`", "Write `@Suite` when you want a name or traits"],
  ["Traits", "`@Suite(.serialized)`, `@Test(.disabled(\"reason\"))`, `.tags(.money)`", "Run tests one at a time, skip one with a reason, or filter by tag"],
  ["Nesting", "A `struct` inside a suite is a sub-suite", "Group by feature: `LedgerTests.Recording`, `LedgerTests.Totals`"],
]

[[part.section.entry]]
id = "try-in-tests"
title = "try in tests"
aliases = ["try in tests", "throws test", "test throws", "why try in test", "try! in tests", "do catch in tests", "throwing setup", "@Test throws"]

[part.section.entry.table]
header = ["Situation", "Write", "What happens"]
rows = [
  ["Setup calls a throwing function you expect to succeed", "Mark the test `throws`, then `try ledger.record(...)`", "If it throws, the test fails and the report shows the error; no `do`/`catch` needed"],
  ["Checking that a call DOES throw", "`#expect(throws: MyError.someCase) { try f() }`", "Passes only for that error; the test itself doesn't need `throws` for this"],
  ["Unwrapping something later checks need", "`let first = try #require(items.first)`", "Stops this test right there if it is nil, instead of crashing"],
  ["Async throwing code", "`@Test func loads() async throws { try await ... }`", "Same rules, plus `await`"],
  ["Avoid", "`try!` and `try?` in tests", "`try!` crashes the whole test run; `try?` silently hides the failure you wanted to see"],
]

[[part.section.entry]]
id = "parameterized-tests"
title = "Parameterized tests: @Test(arguments:)"
aliases = ["arguments", "@Test(arguments:)", "parameterized test", "parametrized", "test many inputs", "test cases", "zip arguments", "two argument lists", "data driven test", "pytest parametrize", "argument syntax"]
code = ["testing/ArgumentsTests.swift:ArgumentsTests"]
use_when = "The same check should hold for several inputs: boundaries such as 0 and -1, or a table of inputs and expected outputs."
gotcha = "Order inside `@Test(...)`: the display name string first, then `arguments:`. The function gets one parameter per argument collection, and its type must match the elements: `arguments: [0, -1]` needs `func f(count: Int)`. Two collections run every combination (2 x 3 = 6 cases); wrap them in `zip(a, b)` to pair them one to one. Each value runs as its own test case on a fresh suite instance, and the report names the value that failed. Enums work well: `arguments: Category.allCases`."

[[part.section.entry]]
id = "what-to-test"
title = "What to test: a checklist"
aliases = ["edge cases", "what should I test", "test cases", "happy path", "boundary", "empty case", "ties", "invalid input", "test plan"]

