code = ["dsa/Arrays.swift:demoTransforms"]
gotcha = "Use `reduce(into:)` to build arrays or dictionaries. `reduce` with `+ [x]` copies on every step: O(n^2)."

[[part.section.entry]]
id = "reduce"
title = "reduce step by step: partialResult, $0 & $1"
aliases = ["reduce", "partialResult", "$0 + $1", "sum a property", "total of array", "reduce(0, +)", "running total", "accumulator", "fold", "Xcode reduce placeholder", "anonymous closure arguments"]
code = ["dsa/Arrays.swift:Purchase", "dsa/Arrays.swift:demoReduce"]
time = "O(n)"
space = "O(1)"
use_when = "Combining every element into ONE value: a total, a maximum, a count. To build an array or dictionary instead, use `reduce(into:)`."
gotcha = "`reduce(start) { running, element in ... }` starts the running result at `start`, then for each element calls your closure with (the result so far, that element) and keeps what you return. When Xcode autocompletes it as `{ partialResult, Transaction in code }`, those are placeholders: `partialResult` is the running total and `Transaction` stands for the element, so rename it to a lowercase name such as `purchase` (leaving the type name there won't compile as intended). `$0` and `$1` are Swift's automatic names for a closure's first and second parameters, so `{ $0 + $1.cents }` is the same closure without naming them. An empty array returns `start` untouched."

[[part.section.entry]]
id = "key-path-map"
title = "map & key paths: map(\\.name)"
aliases = ["map", "key path", "keypath", "\\.", "map(\\.merchant)", "map key path", "KeyPath", "keyPath:", "transform each element", "extract property from array", "pluck", "filter(\\.isDone)", "projection"]
code = ["dsa/Arrays.swift:demoKeyPathMap"]
time = "O(n)"
space = "O(n) for the new array"
use_when = "Pulling one property out of every element, such as all the names, so one `==` can check a whole array and its order in a test."
gotcha = "`map` always returns a NEW array of the same length and order, with each element transformed; the original is untouched. A key path `\\.item` is a reference to a property, checked at compile time, and Swift lets you pass it wherever a closure `(Element) -> Value` is expected, so `map(\\.item)` means `map { $0.item }`. It works with `filter`, `contains(where:)`, `sorted(using:)`, `min(by:)` only when the shape fits (a `Bool` path for `filter`). Paths chain (`\\.item.count`). If the transform needs logic, write a closure instead."

[[part.section.entry]]
id = "comprehensions"
title = "List comprehensions: map, filter & flatMap"
aliases = ["list comprehension", "python comprehension", "for in range", "dict comprehension", "set comprehension", "nested loop", "generator", "all any sum"]
code = ["dsa/Arrays.swift:demoComprehensions", "dsa/Arrays.swift:demoComprehensionsMore"]
use_when = "Swift has no comprehension syntax. Chain map/filter on a range or array; flatMap stands in for a second `for`."
gotcha = "Python's `[x for ... if cond]` filters before mapping. In Swift, put `filter` before `map`."

[[part.section.entry]]
id = "array-search"
title = "contains, first(where:) & min/max"
aliases = ["firstIndex", "lastIndex", "allSatisfy", "every element", "all match", "count where", "search array", "contains where", "contains", "check existence", "already exists", "is new or existing", "exists by id", "contains(where:)", "Set contains"]
code = ["dsa/Arrays.swift:demoSearchArrays", "dsa/Arrays.swift:Reservation", "dsa/Arrays.swift:demoExistence"]
gotcha = "`allSatisfy` on an empty collection is `true`. Guard against empty input when \"all match\" must mean \"at least one, and all\". Existence check: `contains(x)` needs Equatable elements; for structs use `contains { $0.id == x.id }` (two values with equal fields but different ids are different items). It is O(n); for many checks build a `Set` of ids once."

[[part.section.entry]]
id = "iteration"
title = "enumerated, zip & stride"
aliases = ["loop with index", "indices", "reverse loop", "step", "pairs", "zip", "zip two arrays", "pair up arrays", "enumerated", "offset element", "adjacent pairs", "neighbours", "tuple .0 .1"]
code = ["dsa/Arrays.swift:demoIteration", "dsa/Arrays.swift:demoZip"]
gotcha = "`zip(a, b)` gives pairs `(a[0], b[0]), (a[1], b[1]), ...` and stops at the shorter sequence without any error, so check lengths first if every element must have a partner. Each pair is a tuple, read with `.0` and `.1` or unpacked in `for (x, y) in zip(a, b)`. `zip(xs, xs.dropFirst())` gives each element with its next neighbour."

