[[part.section.entry]]
id = "comparable"
title = "A Comparable, Hashable type"
aliases = ["Comparable", "Hashable", "custom sort", "tuple comparison", "<", "protocol conformance"]
code = ["dsa/Language.swift:Job", "dsa/Language.swift:demoComparable"]
gotcha = "Tuples compare element by element, so `(a.priority, a.name) < (b.priority, b.name)` breaks ties for free."

[[part.section.entry]]
id = "equatable"
title = "Equatable, Identifiable & Hashable"
aliases = ["Equatable", "==", "!=", "synthesized ==", "Identifiable vs Equatable", "same id different values", "onChange requires Equatable", "compare structs", "Hashable", "has the form changed", "dirty check"]
code = ["dsa/Language.swift:Note", "dsa/Language.swift:demoEquatable"]
use_when = "Equatable whenever you compare two values with `==`: a draft against the saved copy, expected against actual in a test, or a value SwiftUI watches. Identifiable when SwiftUI must track the same record across edits. Hashable for Set members, Dictionary keys and `id: \\.self`."
gotcha = "Swift writes `==` for you when every stored property (or every associated value) is Equatable; otherwise you write `static func ==`. Identifiable asks \"is this the same record?\" (same `id`) while Equatable asks \"are the values identical right now?\", so an edited copy has the same id but is not `==`. SwiftUI's `.onChange(of:)` needs an Equatable value, because it compares old and new to decide whether to run. Error enums usually add Equatable too, so tests can write `#expect(throws: MyError.someCase)`. Hashable includes Equatable, so `: Hashable` alone gives you both."

[[part.section]]
id = "errors"
title = "Error handling"
group = "Syntax"

[[part.section.entry]]
id = "custom-errors"
title = "Custom errors: enum, throw & LocalizedError"
aliases = ["Error enum", "custom error", "throw", "throws", "typed throws", "throws(MyError)", "Error protocol", "Error Equatable", "any Error", "LocalizedError", "errorDescription", "localizedDescription", "exception", "invalid operation", "throws vs Bool vs optional", "reject bad input"]
code = ["dsa/Errors.swift:TransferError", "dsa/Errors.swift:parseCents", "dsa/Errors.swift:withdraw"]
availability = "Typed throws need Swift 6"
use_when = "An enum conforming to `Error` lists every way an operation fails; associated values carry the details."
gotcha = "Only a type that conforms to `Error` can be thrown, so `throw MyError.x` won't compile without `: Error`. Plain `throws` means \"throws `any Error`\", so a `catch` only knows it has some error. Typed throws, `func parse() throws(TransferError)`, promise exactly one error type, so in `catch` the `error` is already a `TransferError` and you can `switch` on it with no casting, and `throw .invalidAmount(text)` can drop the type name. Plain `throws` is still the default because it is easier to change later; use typed throws for a small module whose failures are a closed list. Add `Equatable` so tests and code can compare errors with `==`, and `Sendable` when the error crosses tasks or actors (an enum with Sendable associated values gets it automatically). Swift calls these errors, not exceptions: a throwing function is marked `throws`, every call is marked `try`, and the error is an ordinary return path rather than a stack unwind, so say \"it throws an error\". For a bad input that the caller should hear about, throw. Return an optional when \"not found\" is normal and needs no reason, and use `precondition` only for a programmer mistake that should crash."

