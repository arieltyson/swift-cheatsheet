[[part.section.entry]]
id = "targeted-padding"
title = "Padding on chosen edges"
aliases = ["padding", "padding leading", "padding(.leading", "padding top", "horizontal padding", "vertical padding", "padding edges", "Edge.Set", "inset one side", "EdgeInsets", "indent"]
code = ["swiftui/Modifiers.swift:TargetedPadding"]
availability = "iOS 13+"
use_when = "Space on some sides only: `.padding(.leading, 58)` to clear a label column, `.padding(.horizontal)` for screen margins, `.padding(.vertical, 8)` for row height."
figure = { src = "figures/targeted-padding.png", alt = "Five mint boxes, each with code text inside. padding(): space on all sides. leading 40: space only on the left. horizontal 40: space left and right. vertical 16: space above and below. top and trailing 24: space above and to the right.", caption = "TargetedPadding: the mint box is the size after padding." }
gotcha = "Edges: `.top`, `.bottom`, `.leading`, `.trailing`, `.horizontal`, `.vertical`, `.all`, or a set like `[.top, .leading]`. Use leading/trailing, not left/right, so right-to-left languages flip correctly. With no number, the system picks a standard amount (about 16)."

[[part.section.entry]]
id = "offset-directions"
title = "offset: move a view without moving its neighbours"
aliases = ["offset", "offset x", "offset y", "move view", "shift view", "negative offset", "offset vs padding", "offset vs position", "nudge"]
code = ["swiftui/Modifiers.swift:OffsetDirections"]
availability = "iOS 13+"
use_when = "Placing views from data (an event at y = start x 60) inside a top-leading ZStack, or nudging something. Positive x is right, positive y is DOWN; negative goes left or up."
figure = { src = "figures/offset-directions.png", alt = "Five orange chips with dashed outlines at their original spots. x 40 moved right, x minus 20 moved left, y 12 down, y minus 12 up, and x 40 y 12 right and down.", caption = "OffsetDirections: the dashed box is where layout put each chip; the colour is where it is drawn." }
gotcha = "Offset doesn't change layout: neighbours stay put and the view can overlap them or leave a gap. To push neighbours, use `.padding`. `.position(x:y:)` sets the view's CENTRE in its parent instead."

[[part.section.entry]]
id = "frames-aspect-ratio"
title = "Frame tuning & aspectRatio"
aliases = ["frame", "maxWidth", "maxHeight", "minWidth", "minHeight", ".infinity", "fill width", "full width", "fixed size", "fixedSize", "frame alignment", "aspectRatio", "contentMode", ".fit", ".fill", "scaledToFit", "scaledToFill", "square", "16:9", "clipped", "resizable", "cells too big", "layout overflows screen", "not square", "maxHeight value", "what does infinity mean", "hugging", "takes only the space it needs", "modifier order"]
code = ["swiftui/Frames.swift:FrameTuning", "swiftui/Frames.swift:AspectRatioGallery"]
availability = "iOS 16+"
use_when = "Sizing a view to the space it's offered. `maxWidth: .infinity` fills; `width:` fixes; `min`/`max` set a range. `aspectRatio` then picks a shape inside that space."
figure = { src = "figures/aspect-ratio.png", alt = "Six 160 by 100 point dashed slots. No modifier fills the slot. 16/9 fit is a wide band touching the sides. 1 fit is a centred square. 1 fill covers the slot and is clipped. 3/4 fit is a narrow centred portrait. scaledToFit shows a mountain symbol at its own proportions.", caption = "AspectRatioGallery on an iPhone: the dashed box is the space offered, the colour is the size the view chose." }
gotcha = "Text, Image and Button hug their content: they take only what they need, not what is offered, until a frame lets them grow. `.infinity` means \"accept whatever the parent offers\", not \"be infinitely big\"; with no `maxHeight`, the height stays the content's own. Order matters. Size first, then shape: `.frame(maxWidth: .infinity, maxHeight: .infinity).aspectRatio(1, contentMode: .fit)` makes a square that grows with the screen. `.fill` overflows the slot unless you add `.clipped()`. Never hardcode the screen width (390): devices differ, so let the frame fill and the ratio decide."

[[part.section.entry]]
id = "greedy-controls"
title = "Greedy controls in a centred stack"
aliases = ["Stepper full width", "pushed to the edges", "VStack not centered", "VStack centre", "greedy view", "Toggle stretches", "fixedSize", "padding", "hug content", "control at screen edge"]
code = ["swiftui/Frames.swift:GreedyControls"]
availability = "iOS 17+"
use_when = "A Stepper, Toggle, TextField or Slider looks stuck to the screen edges even though the stack centres its children."
