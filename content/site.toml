gotcha = "A stack centres a child only when the child is narrower than the stack. `Stepper`, `Toggle`, `TextField`, `Slider`, `Color` and shapes are greedy: they take the full width, so \"centred\" is edge to edge. `.padding()` is the usual fix (it insets everything); `.fixedSize()` makes the control hug its content so the stack can centre it."

