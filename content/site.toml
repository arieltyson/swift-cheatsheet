[[part.section.entry]]
id = "rolling-window"
title = "Rolling time window in an actor"
aliases = ["rolling window", "time window", "last N seconds", "expire old", "evict old", "purge old data", "thread safe buffer", "timestamps", "keep arrival order", "callback to actor", "backpressure", "threshold check"]
