figure = { src = "figures/toolbar-placements.png", alt = "Two phones. Left: a form sheet with Cancel at top left, Principal in the centre, a greyed Save at top right, and a trash button and bottomBar label at the bottom. Right: a list with Edit at top left, Sides title, and a plus at top right.", caption = "ToolbarPlacements (left): semantic placements plus .principal and .bottomBar. ToolbarSides (right): explicit leading and trailing." }
gotcha = "Shape: `.toolbar { ToolbarItem(placement: .x) { Button(...) } }`. One view per `ToolbarItem`; several need `ToolbarItemGroup`. Put a `Button`, not a `Text`, inside or nothing is tappable. `dismiss` is read with `@Environment(\\.dismiss) private var dismiss` and CALLED with `dismiss()` (it is a value you call, like a function). In Save, hand the data back first (`onSave(item)`), then `dismiss()`. The toolbar needs the sheet's own `NavigationStack`."

[[part.section.entry]]
