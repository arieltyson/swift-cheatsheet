[[part.section.entry]]
id = "observable"
title = "@Observable, @Environment & @Bindable"
aliases = ["Observation", "model", "environment", "Bindable", "shared state", "view model", "$model.property", "binding to a model property", "Stepper binding", "why does Stepper need a binding", "Toggle TextField Slider Picker binding", "binding vs method call", "cannot find $ in scope"]
