availability = "iOS 13+"
time = "O(1) amortized per append, O(1) per peak"
space = "O(n) worst case, usually far less"
use_when = "You only need the largest value, so values that can never win are not worth keeping. Compare `peak` with a threshold to answer \"was it ever this high?\"."

