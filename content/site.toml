  ["Dark mode or bigger text", "`.preferredColorScheme(.dark)`, `.dynamicTypeSize(.xxxLarge)`", "Or the canvas's variant buttons."],
  ["Older code", "`struct X_Previews: PreviewProvider { static var previews: some View { ... } }`", "Still works; `#Preview` (iOS 17 / Xcode 15) is the modern form."],
] }
use_when = "Seeing a view without running the app. If the canvas says it crashed, the view is usually missing something the app provides (environment model, NavigationStack)."

