[[part.section.entry]]
id = "xcode-tools"
title = "Which Xcode tool finds which bug"
aliases = ["debugger", "lldb", "po", "memory graph", "instruments", "leaks", "thread sanitizer", "main thread checker", "view hierarchy", "breakpoint"]

[part.section.entry.table]
header = ["Symptom", "Tool", "How"]
rows = [
  ["Wrong value, unclear flow", "Breakpoint + LLDB", "`po value`, `p value`, `expr value = 1`; edit a breakpoint to log and continue"],
  ["Crash with no clear line", "Exception and Swift Error breakpoints", "Breakpoint navigator, +, then Exception / Swift Error Breakpoint"],
  ["Object never freed", "Memory Graph Debugger", "Debug bar, Debug Memory Graph; purple ! marks leaks, follow the strong references"],
  ["Memory grows over time", "Instruments: Leaks, Allocations", "Product, Profile; repeat the action and look for growth"],
  ["UI updated off the main thread", "Main Thread Checker", "Scheme, Run, Diagnostics (on by default); breaks on the call"],
  ["Data race, random corruption", "Thread Sanitizer", "Scheme, Run, Diagnostics, Thread Sanitizer"],
  ["View missing, clipped or covered", "View Hierarchy Debugger", "Debug bar, Debug View Hierarchy; rotate the 3D stack"],
  ["SwiftUI view updates too often", "`Self._printChanges()`, SwiftUI instrument", "Call it in `body`; it prints which property changed"],
  ["Slow or stuttering", "Instruments: Time Profiler, Hangs", "Find the heaviest stack on the main thread"],
]
