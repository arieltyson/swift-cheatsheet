aliases = ["extracted subview", "extract subview", "subview", "sub-view helper", "subview helper", "helper function returning a view", "computed view property", "private var header: some View", "func row() -> some View", "inline body", "@ViewBuilder", "ViewBuilder", "some View property", "computed view property", "helper view function", "break up body", "body too long", "the compiler is unable to type-check this expression", "container view", "Content: View", "AnyView", "Group", "reusable view"]
code = ["swiftui/Composition.swift:ReceiptInline", "swiftui/Composition.swift:ReceiptSplit", "swiftui/Composition.swift:AmountLabel", "swiftui/Composition.swift:Panel", "swiftui/Composition.swift:ReceiptCardScreen"]
