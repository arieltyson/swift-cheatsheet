aliases = ["navigationBarTitleDisplayMode", "display mode", "large title", "inline title", "automatic", "small title", "centered title", "navigationTitle not showing", "toolbar not showing", "modifier on NavigationStack", "ToolbarItem placement", "topBarTrailing"]
code = ["swiftui/Toolbar.swift:TitleModeScreen"]
availability = "iOS 17+"
use_when = "Every screen inside a NavigationStack. `.large` for a top-level list, `.inline` for detail screens, sheets and anything where vertical space matters."
figure = { src = "figures/title-display-modes.png", alt = "Two phones. Left: .large, a big bold Inbox title under the bar, with a plus button at the top right. Right: .inline, a small Inbox title centred in the bar next to the same plus button.", caption = "TitleModeScreen with .large (left) and .inline (right). A .large title shrinks into the inline style once the list scrolls." }
