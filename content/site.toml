[[part.section.entry]]
id = "actor"
title = "actor: shared state without data races"
aliases = ["actor", "data race", "thread safe", "isolation", "reentrancy", "Sendable", "single-threaded", "single threaded", "multithreaded", "concurrent access", "lock", "thread"]
code = ["concurrency/Isolation.swift:BankAccount", "concurrency/Isolation.swift:demoActor"]
availability = "iOS 13+"
gotcha = "Actors are re-entrant: state can change at every `await` inside an actor method. Re-check conditions after awaiting. A thread is one line of execution, and an app runs several at once. Single-threaded means only one thread ever touches an object (in an app, usually the main thread), so a plain class needs no protection. If two threads can write the same property at the same moment, that is a data race and can corrupt it; an actor fixes that by letting one caller in at a time."

[[part.section.entry]]
id = "actor-init"
title = "Initializing an actor"
aliases = ["actor init", "actor initializer", "async init", "init async", "initialization", "create an actor", "actor constructor", "actor-isolated instance method in a synchronous nonisolated context", "let without await", "nonisolated let"]
code = ["concurrency/Isolation.swift:Tally", "concurrency/Isolation.swift:demoActorInit"]
availability = "iOS 13+"
use_when = "Use a plain `init` when setting properties is enough. Use `init(...) async` when setup has to call the actor's own methods or await something."
gotcha = "Calling an actor method from a plain `init` fails to compile: \"call to actor-isolated instance method in a synchronous nonisolated context\". Make the `init` async, or call the method after creating the actor."

[[part.section.entry]]
id = "sendable"
title = "Sendable: values safe to share across tasks"
aliases = ["Sendable", "@Sendable", "sendable closure", "non-sendable type", "capture of non-sendable", "crossing isolation", "Task.detached", "final class Sendable", "@unchecked Sendable", "strict concurrency"]
code = ["concurrency/Isolation.swift:Receipt", "concurrency/Isolation.swift:ReceiptError", "concurrency/Isolation.swift:Settings", "concurrency/Isolation.swift:demoSendable"]
use_when = "A value passes into a `Task`, an actor, or a `@MainActor` view model from somewhere else. Swift 6 checks this at compile time."
gotcha = "Structs and enums whose stored values are all Sendable are Sendable automatically, unless they are `public`, where you must write it. Actors are always Sendable. A class is Sendable only if it is `final` and has only `let` properties of Sendable types; an `@Observable` class with `var`s is not, so keep it on `@MainActor` instead. `@unchecked Sendable` turns the check off and makes you responsible for locking, so avoid it. Errors like \"capture of non-Sendable type in a @Sendable closure\" mean a mutable class is leaking into another task."

[[part.section.entry]]
id = "rolling-window"
title = "Rolling time window in an actor"
aliases = ["rolling window", "time window", "last N seconds", "expire old", "evict old", "purge old data", "thread safe buffer", "timestamps", "keep arrival order", "callback to actor", "backpressure", "threshold check"]
code = ["concurrency/RollingWindow.swift:TimedValue", "concurrency/RollingWindow.swift:RollingWindow", "concurrency/RollingWindow.swift:drain", "concurrency/RollingWindow.swift:demoRollingWindow"]
availability = "iOS 15+"
time = "O(1) amortized per append, O(n) per check"
space = "O(n), n = values in the window"
use_when = "Many threads add timestamped values and you only care about the most recent stretch of time."
gotcha = "A `Task` per value does not keep arrival order, and eviction relies on that order, so feed the actor from one loop. `.bufferingNewest` drops the oldest values if that loop falls behind. `Deque` is in the swift-collections package, not the standard library."

[[part.section.entry]]
id = "rolling-max"
title = "Largest value in a rolling time window"
aliases = ["rolling max", "peak in window", "max in last N seconds", "O(1) max", "monotonic deque", "time window maximum"]
code = ["concurrency/RollingWindow.swift:RollingMax", "concurrency/RollingWindow.swift:demoRollingMax"]
availability = "iOS 13+"
