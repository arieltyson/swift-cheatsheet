name: Verify and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Build and verify public artifact
        run: |
          python3 -m unittest discover -s tests/site -v
          python3 tools/build.py
          node --check web/app.js
      - name: Install isolated browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/browser" playwright@1.63.0 @axe-core/playwright@4.13.0 --no-audit --no-fund
          "$RUNNER_TEMP/browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify browser behavior and accessibility
        env:
          BROWSER_TEST_MODULES: ${{ runner.temp }}/browser/node_modules
        run: |
          python3 -m http.server 8765 --directory dist --bind 127.0.0.1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in 1 2 3 4 5; do
            curl --fail --silent http://127.0.0.1:8765/ >/dev/null && break
            sleep 1
          done
          node tests/browser/check.cjs
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Upload only public files
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: dist

  native:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Record Apple toolchains
        run: |
          xcodebuild -version
          swift --version
      - name: Verify DSA and Foundation examples
        run: swift test --scratch-path "$RUNNER_TEMP/swift-build"
      - name: Verify native framework examples
        run: python3 tools/native.py

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [website, native]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish verified artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
